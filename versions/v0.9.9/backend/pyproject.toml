[project]
name = "spec-code-ai-reviewer-backend"
version = "0.9.9"
description = "設計書-Javaプログラム突合 AIレビュアー バックエンド"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.12",
    "boto3>=1.35.0",
    "markitdown[xlsx,docx]>=0.0.1a3",
    "anthropic>=0.40.0",
    "openai>=2.14.0",
    "python-dotenv>=1.0.0",
    "add-line-numbers",
    "md2map[nlp,ai]",
    "code2map",
    "excel2md>=2.2.1",
]

[tool.uv.sources]
add-line-numbers = { git = "https://github.com/elvezjp/add-line-numbers.git", branch = "main" }
md2map = { git = "https://github.com/elvezjp/md2map.git", branch = "main" }
code2map = { git = "https://github.com/elvezjp/code2map.git", branch = "main" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
    "openpyxl>=3.1.5",
    "python-docx>=1.1.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
